apiVersion: apps/v1
kind: Deployment
metadata:
  name: cares-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cares
  template:
    metadata:
      labels:
        app: cares
    spec:
      containers:
        - name: cares-container
          image: husnasbhatechie/cares-ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
